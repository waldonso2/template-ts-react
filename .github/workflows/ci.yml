name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions and the shared workflows are pinned to a commit (a tag can be moved); Dependabot keeps them current.
jobs:
  secrets:
    uses: waldonso2/quality-kit/.github/workflows/secrets.yml@2070c7e1ee07901a7313f6a005be303aa44acc04 # v1
  workflows:
    uses: waldonso2/quality-kit/.github/workflows/workflows.yml@2070c7e1ee07901a7313f6a005be303aa44acc04 # v1
  dependency-review:
    uses: waldonso2/quality-kit/.github/workflows/dependency-review.yml@2070c7e1ee07901a7313f6a005be303aa44acc04 # v1
  security-policy:
    # Pinned to the immutable quality-kit merge commit.
    uses: waldonso2/quality-kit/.github/workflows/security-policy.yml@11958335ff550890994a1fda5af4087839c2bf3a

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.23.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build
      # Known vulnerabilities in what ships (dependencies, not dev tools).
      - run: pnpm audit --prod
      # Every page of the built app in Chromium: axe, CSP, phone width.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui
      # Measured and reported on the run's summary page (KENNZAHLEN.md), never failing the build.
      - run: pnpm perf
        continue-on-error: true
